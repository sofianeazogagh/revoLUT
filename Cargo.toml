[package]
name = "revolut"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tfhe = { version = "1.8.2", features = ["boolean", "shortint", "integer"] }
num-complex = "0.4.0"
arrayvec = "0.7.2"
aligned-vec = "0.6.4"
rayon = "1.6.1"
tfhe-csprng = "0.10.0"
dyn-stack = "0.13.2"
itertools = "0.13.0"
tfhe-fft = "0.10.1"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
csv = "1.1.6"
serde_json = "1.0"
ndarray = { version = "0.16.1", features = ["rayon"] }

[dev-dependencies]
quickcheck = "1"
quickcheck_macros = "1"
criterion = { version = "0.5.1", features = ["html_reports"] }


[[bench]]
name = "bma"
harness = false

[[bench]]
name = "2bp"
harness = false

[[bench]]
name = "bp"
harness = false

[[bench]]
name = "bcs"
harness = false
